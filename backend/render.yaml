services:
  - type: web
    name: vibedownloader-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      mkdir -p /opt/render/project/.deno/bin
      curl -fsSL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o deno.zip
      unzip -o deno.zip -d /opt/render/project/.deno/bin
      rm deno.zip
    startCommand: gunicorn app:app
    envVars:
      - key: PATH
        value: /opt/render/project/.deno/bin:/usr/local/bin:/usr/bin:/bin
      - key: PYTHON_VERSION
        value: 3.10.0