services:
  - type: web
    name: vibedownloader-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      export DENO_INSTALL="/opt/render/project/.deno"
      curl -fsSL https://deno.land/install.sh | sh
    startCommand: gunicorn app:app
    envVars:
      - key: PATH
        value: /opt/render/project/.deno/bin:/usr/local/bin:/usr/bin:/bin
      - key: PYTHON_VERSION
        value: 3.10.0